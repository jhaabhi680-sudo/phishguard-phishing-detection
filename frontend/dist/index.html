<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishGuard — AI-powered protection against phishing websites</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script>

      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],

          colors: {
            cyber: {

              border: '#1e293b',
              accent: '#06b6d4',

          }
        }
      }
    };

    }

  <script type="importmap">

<body class="cyber-grid-bg min-h-screen antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
